<style>
:root{--bg:#F4F5F7;--card:#fff;--line:#E3E6EB;--line2:#EEF0F3;--ink:#12151C;--ink2:#3A4250;--mut:#5B6472;--blue:#2348C7;--blueD:#1A3699;--blueL:#EAF0FD;--green:#0B6446;--greenB:#0E7A55;--greenL:#E6F4EE;--amber:#8A4B00;--amberL:#FFF1DE;--amberB:#FFF8EE;--red:#A2380A;--redB:#D9622B;--redL:#FDEDE3;--dark:#12151C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
body{min-height:100vh}

.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(18px + env(safe-area-inset-top)) 16px 6px}

.login .in{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.login .brand{width:184px;height:33px;margin:0 0 10px}
.login h1{margin:0;font-size:26px;font-weight:700}
.login form{display:flex;flex-direction:column;gap:12px;background:#fff;border-radius:16px;padding:18px}
.lg-err{color:var(--red);font-size:14px;font-weight:600}
.lg-ok{color:var(--green);font-size:14px;font-weight:600}
.linkbtn{background:none;border:none;color:var(--blue);font:inherit;font-size:14px;font-weight:600;padding:10px 0;cursor:pointer;min-height:44px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 16px 0}

.wrap{display:flex;flex-direction:column;gap:14px;padding:10px 16px 20px}
.card{background:var(--card);border:none;border-radius:16px;padding:16px}
.dark{background:var(--dark);color:#fff;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.list>.row{padding:10px 0;border-top:1px solid var(--line2)}
.col{display:flex;flex-direction:column;gap:2px;min-width:0}
.k{font-size:12px;color:var(--mut)}
.t{font-size:14px;font-weight:600}
.v{font-size:19px;font-weight:700}
.big{font-size:32px;font-weight:700;letter-spacing:-.02em}
h2{margin:0;font-size:15px;font-weight:700}
.pos{color:var(--green)}.neg{color:var(--red)}.amb{color:var(--amber)}.mut{color:var(--mut)}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:4px 8px;border-radius:999px;white-space:nowrap}
.chip.ok{color:var(--green);background:var(--greenL)}.chip.part{color:var(--amber);background:var(--amberL)}.chip.debt{color:var(--red);background:var(--redL)}.chip.gray{color:var(--ink2);background:var(--line2)}
button,input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}

.btns{display:flex;flex-wrap:wrap;gap:8px}.btns>.btn{flex:1 1 140px}
.link{background:none;border:none;color:var(--blue);font-weight:600;font-size:13px;min-height:44px;cursor:pointer;padding:0;text-decoration:none;display:inline-flex;align-items:center}

.chips{display:flex;flex-wrap:wrap;gap:6px}

.bar{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);border-radius:4px}

nav.tab .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:6px 4px 10px}

.iconbtn{flex:none;width:44px;height:44px;border-radius:22px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}

.note{border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.45}
.note{border:none}
.note.amb{background:var(--amberB);color:#6B3A00}
.note.blue{background:var(--blueL);color:var(--blueD)}
.note.red{background:#FFF4EE;color:#7A2C08}
.note.green{background:var(--greenL);color:var(--green)}
.empty{text-align:center;padding:24px 12px;color:var(--mut);font-size:14px}
.stepper{display:flex;align-items:center;gap:10px}.stepper button{width:44px;height:44px;border-radius:22px;border:1px solid #D5DAE1;background:#fff;font-size:20px;cursor:pointer}.stepper span{min-width:32px;text-align:center;font-size:22px;font-weight:700}
.tap{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;cursor:pointer;font:inherit;color:inherit}
.rowbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border:none;border-top:1px solid var(--line2);background:none;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.line-row{display:flex;align-items:center;gap:6px;background:#fff;border:none;border-radius:12px;padding:4px 4px 4px 12px}
.line-row input{border:none;outline:none;background:transparent;min-height:40px}
.line-row .nm{flex:1 1 auto;min-width:0}.line-row .am{flex:0 0 108px;width:108px;background:var(--bg);border-radius:8px;padding:0 8px;text-align:right;font-weight:700}
table.hrs{width:100%;border-collapse:collapse;font-size:14px}table.hrs td{padding:6px 2px;border-top:1px solid var(--line2)}table.hrs input{width:80px;min-height:40px;border:1px solid #D5DAE1;border-radius:8px;padding:0 8px;text-align:right}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dot{flex:none;width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center}
.dot.ok{background:var(--greenB);color:#fff}.dot.no{border:2px solid var(--redB)}
.pre{white-space:pre-line}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
@media (min-width:900px){#app{max-width:720px}nav.tab .in{max-width:720px}.sheet-bg{align-items:center}.sheet{max-width:620px;border-radius:18px;max-height:90vh}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>

<body>
<div id="app"><div id="main"></div></div>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var MONTHS = ['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
function pad(n){ return String(n).padStart(2,'0'); }
function today(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function curMonth(){ return today().slice(0,7); }
function addM(m,k){ var p=m.split('-').map(Number), y=p[0], mm=p[1]+k; while(mm>12){mm-=12;y++;} while(mm<1){mm+=12;y--;} return y+'-'+pad(mm); }
function mDiff(a,b){ var x=a.split('-').map(Number), y=b.split('-').map(Number); return (y[0]*12+y[1])-(x[0]*12+x[1]); }
function mName(m){ var p=m.split('-'); return MONTHS[Number(p[1])-1]+' '+p[0]; }
function mShort(m){ return MONTHS[Number(m.split('-')[1])-1]; }
function lastDay(m){ var p=m.split('-').map(Number); return new Date(p[0],p[1],0).getDate(); }
function dayOf(m,d){ return m+'-'+pad(Math.min(Math.max(1,Number(d)||1), lastDay(m))); }
function dShort(d){ return d ? d.slice(8,10)+'.'+d.slice(5,7) : ''; }
function dFull(d){ return d ? d.slice(8,10)+'.'+d.slice(5,7)+'.'+d.slice(0,4) : ''; }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function fmt(n){ n=Math.round(Number(n)||0); var s=String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' '); return (n<0?'−':'')+s; }
function sgn(n){ return (n>0?'+':'')+fmt(n); }
function mln(n){ return (Math.round((Number(n)||0)/100000)/10).toString().replace('.',',')+' mln'; }
function num(v){ return parseInt(String(v==null?'':v).replace(/\D/g,''),10)||0; }
function dec(v){ var x=parseFloat(String(v==null?'':v).replace(',','.')); return isFinite(x)&&x>0?x:0; }
function pctTxt(x){ if(x==null||!isFinite(x)) return '—'; return (Math.round(x*10)/10).toString().replace('.',',')+'%'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function clone(o){ return JSON.parse(JSON.stringify(o||{})); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

var ICONS = {
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  arrows:'<path d="M7 20V4M4 7l3-3 3 3M17 4v16M14 17l3 3 3-3"/>',
  folder:'<path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14c2.2.6 3.5 2.8 3.5 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  l:'<path d="M15 6l-6 6 6 6"/>',
  r:'<path d="M9 6l6 6-6 6"/>',
  gear:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  file:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'
};
function icon(n,size,sw){ size=size||22; sw=sw||1.8; return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[n]||'')+'</svg>'; }

/* ---------------- state ---------------- */
var COLS = ['projects','staff','months','promises','ledger'];
var S = {
  mode:'loading', db:null, assets:null, slow:false, err:null, hasCache:false, user:null, authKnown:false, wasIn:false, fbErr:false, lg:{err:'',ok:'',busy:false},
  loaded:{projects:false,staff:false,months:false,promises:false,ledger:false,settings:false},
  confirmed:{},
  projects:{}, staff:{}, entries:{}, ledger:{}, months:{}, promises:{},
  settings:{startCash:0,startDate:'2026-11-01'},
  view:'panel', month:curMonth(), pid:null, ptab:'hisob', kcf:'all', kcLimit:100, showInactive:false
};
var SH = null;
function arr(c){ return Object.keys(S[c]).map(function(k){ return S[c][k]; }); }
function appStart(){ return String(S.settings.startDate||'2026-11-01').slice(0,7); }
function MD(m){ var d=S.months[m]?clone(S.months[m]):{}; delete d.id; d.hours=d.hours||{}; d.work=d.work||{}; d.ack=d.ack||{}; d.closed=!!d.closed; return d; }
function fixedStaff(all){ return arr('staff').filter(function(s){ return s.type==='fixed'&&(all||!s.archived); }).sort(byName); }
function pieceStaff(all){ return arr('staff').filter(function(s){ return s.type==='piece'&&(all||!s.archived); }).sort(byName); }
function byName(a,b){ return String(a.name||'').localeCompare(String(b.name||'')); }
function pName(id){ var p=S.projects[id]; return p?p.name:'(o‘chirilgan loyiha)'; }
function sName(id){ var s=S.staff[id]; return s?s.name:'(o‘chirilgan)'; }

/* ---------------- calculations ---------------- */
function activeIn(p,m){
  if(!p||!p.startMonth||m<p.startMonth) return false;
  if(num(p.months)>0 && m>=addM(p.startMonth,num(p.months))) return false;
  if(p.endMonth && m>p.endMonth) return false;
  return true;
}
function salaryPlan(s){ var pl=(s&&s.salaryPlan||[]).filter(function(r){ return r&&/^\d{4}-\d{2}$/.test(String(r.from||'')); }).slice().sort(function(a,b){ return a.from<b.from?-1:1; }); return pl; }
function salaryAt(s,m){ var pl=salaryPlan(s).filter(function(r){ return r.from<=m; }); return pl.length?num(pl[pl.length-1].salary):num(s.salary); }
function nextRaise(s){ var cm=curMonth(), pl=salaryPlan(s).filter(function(r){ return r.from>cm; }); return pl.length?pl[0]:null; }
function accrual(s,m){
  if(!s||s.type!=='fixed') return 0;
  if(s.startMonth && m<s.startMonth) return 0;
  if(s.endMonth && m>s.endMonth) return 0;
  if(m>curMonth()) return 0;
  return salaryAt(s,m);
}
function paidFor(sid,m){ return arr('entries').filter(function(e){ return e.type==='salary'&&e.staffId===sid&&e.forMonth===m; }).reduce(function(a,e){ return a+num(e.amount); },0); }
function isUSD(p){ return !!p&&p.currency==='USD'; }
function hasUSD(){ return arr('projects').some(isUSD); }
function money(n,cur){ return cur==='USD'?'$'+fmt(n):fmt(n); }
function rateFor(m){ var md=S.months[m]; if(md&&md.closed&&num(md.rate)) return num(md.rate); return num(S.settings.usdRate); }
function clientPays(pid,m){ return arr('entries').filter(function(e){ return e.type==='client'&&e.projectId===pid&&e.forMonth===m; }); }
function paidNative(p,m){ var usd=isUSD(p); return clientPays(p.id,m).reduce(function(a,e){ if(!usd) return a+num(e.amount); if(e.usd!=null) return a+num(e.usd); return a+(num(e.rate)?num(e.amount)/num(e.rate):0); },0); }
function paidClient(pid,m){ var p=S.projects[pid]; return p?paidNative(p,m):0; }
function dueDate(s,m){ return s.payWhen==='next' ? dayOf(addM(m,1), s.payDay||1) : dayOf(m, s.payDay||1); }
function staffOutstanding(s){
  var out=[]; if(!s||s.type!=='fixed') return out;
  var start = s.startMonth && s.startMonth>appStart() ? s.startMonth : appStart();
  var m=start, end=curMonth(), g=0;
  while(m<=end && g<120){ var a=accrual(s,m), p=paidFor(s.id,m); if(a-p>0) out.push({s:s, month:m, accr:a, paid:p, rest:a-p, due:dueDate(s,m)}); m=addM(m,1); g++; }
  return out;
}
function staffOutsAll(){ var o=[]; fixedStaff(true).forEach(function(s){ o=o.concat(staffOutstanding(s)); }); return o.sort(function(a,b){ return a.due<b.due?-1:1; }); }
function clientDebtList(){
  var out=[], end=curMonth(), st=appStart();
  arr('projects').forEach(function(p){
    if(!p.startMonth) return; var m=p.startMonth<st?st:p.startMonth, g=0;
    while(m<=end && g<120){ if(activeIn(p,m)){ var price=num(p.price), paid=paidNative(p,m), cur=isUSD(p)?'USD':'UZS'; if(price-paid>0.5){ var dn=price-paid; out.push({p:p, month:m, debt:dn, cur:cur, uzs:cur==='USD'?dn*rateFor(m):dn, paid:paid, due:dayOf(m,p.payDay||1)}); } } m=addM(m,1); g++; }
  });
  return out.sort(function(a,b){ return a.due<b.due?-1:1; });
}
function calc(m){
  var exp = arr('entries').filter(function(e){ return e.type==='expense'&&e.month===m; });
  var md = MD(m), rates={}, salaries=0;
  fixedStaff(true).forEach(function(s){
    var a=accrual(s,m); if(!a) return; salaries+=a;
    var h=md.hours[s.id]||{}, H=0; Object.keys(h).forEach(function(k){ H+=dec(h[k]); });
    rates[s.id]={a:a,H:H,h:h};
  });
  var proj={}, alloc=0;
  arr('projects').forEach(function(p){
    var act=activeIn(p,m);
    var pe=exp.filter(function(e){ return e.projectId===p.id&&!e.unassigned; });
    var hasH=Object.keys(rates).some(function(k){ return dec(rates[k].h[p.id])>0; });
    if(!act&&!pe.length&&!hasH) return;
    var cur=isUSD(p)?'USD':'UZS', rate=rateFor(m);
    var paidU=clientPays(p.id,m).reduce(function(a,e){ return a+num(e.amount); },0);
    var priceN=act?num(p.price):0, paidN=paidNative(p,m), debtN=act?Math.max(0,priceN-paidN):0;
    if(debtN<0.5) debtN=0;
    var price=act?(cur==='USD'?paidU+debtN*rate:priceN):0;

function ack(p){

}
function wrapDoc(sn){ return {id:sn.id, exists:sn.exists(), data:function(){ return sn.data(); }, metadata:sn.metadata}; }

    get:function(){ return M.getDoc(ref).then(wrapDoc); },
    onSnapshot:function(cb,err){ return M.onSnapshot(ref,{includeMetadataChanges:true},function(sn){ cb(wrapDoc(sn)); },err); }
  }; }

    collection:function(c){ return {
      doc:function(id){ return D(M.doc(fs,c,id)); },
      onSnapshot:function(cb,err){ return M.onSnapshot(M.collection(fs,c),{includeMetadataChanges:true},function(q){ cb({metadata:q.metadata, empty:q.empty, docs:q.docs.map(function(d){ return {id:d.id, data:function(){ return d.data(); }}; })}); },err); }
    }; },

function header(title,o){
  o=o||{};
  var h='<header class="hdr"><div style="display:flex;align-items:center;gap:10px;min-width:0">';
  if(o.back) h+='<button type="button" class="iconbtn" data-a="back" aria-label="Orqaga">'+icon('l',18,2)+'</button>';
  h+='<div class="col">'+(o.brand?BRAND:'<span class="sub">'+esc(o.sub||'')+'</span>')+'<h1>'+esc(title)+'</h1></div></div>';
  if(o.gear) h+='<button type="button" class="iconbtn" data-a="settings" aria-label="Sozlamalar">'+icon('gear',20)+'</button>';
  if(o.right) h+=o.right;
  h+='</header>';
  if(o.month) h+='<div class="mnav"><button type="button" class="iconbtn" data-a="mprev" aria-label="Oldingi oy">'+icon('l',18,2)+'</button><strong>'+esc(mName(S.month))+(MD(S.month).closed?' · yopilgan':'')+'</strong><button type="button" class="iconbtn" data-a="mnext" aria-label="Keyingi oy"'+(S.month>=curMonth()?' disabled':'')+'>'+icon('r',18,2)+'</button></div>';
  return h;
}
function localBanner(){
  if(S.err==='permission-denied') return '<div class="note red">Bu akkauntga bazani ko‘rishga ruxsat yo‘q. Sozlamalardan chiqib, o‘z akkauntingiz bilan kiring.</div>';
  if(S.fbErr) return '<div class="note amb">Internet yo‘q — oxirgi saqlangan raqamlar ko‘rsatilmoqda.</div>';
  var synced=S.mode==='db'&&COLS.every(function(c){ return S.confirmed[c]; });
  if(synced) return '';
  if(S.slow) return '<div class="note amb">Internet sekin yoki yo‘q — oxirgi saqlangan raqamlar ko‘rsatilmoqda. Yangi yozuvlar internet kelganda o‘zi yuboriladi.</div>';
  return '';
}
function payChip(x){
  if(!x.act) return '<span class="chip gray">Faol emas</span>';
  if(!(x.debtN>0)) return '<span class="chip ok">To‘ladi</span>';
  var due=dayOf(x.m||S.month,x.p.payDay||1), late=daysBetween(due,today());
  if(x.paidN>0) return '<span class="chip part">Qisman · '+esc(x.cur==='USD'?'$'+fmt(x.debtN):mln(x.debtN))+' qarz</span>';
  return '<span class="chip debt">Qarz'+(late>0?' · '+late+' kun':'')+'</span>';
}
function entryInfo(e){
  var t='', s=dShort(e.date), cls='';
  if(e.type==='expense'){
    if(e.cat==='Montaj'){ t=sName(e.editorId)+' · '+pName(e.projectId); s+=' · Montaj, '+num(e.videos)+' video'+(e.extra?' · qo‘shimcha':''); }
    else { t=(e.lines&&e.lines.length===1?e.lines[0].name:e.cat)+' · '+(e.unassigned?'biriktirilmagan':e.projectId?pName(e.projectId):'agentlik'); s+=' · '+e.cat+(e.lines&&e.lines.length>1?', '+e.lines.length+' qator':''); }
    if(e.payer==='ozim'){ s+=' · o‘zimdan, kassaga ta’sir qilmaydi'; cls='amb'; }
  } else if(e.type==='salary'){ t=sName(e.staffId)+' · oylik'; s+=' · '+mShort(e.forMonth)+' uchun'; }
  else if(e.type==='client'){ t=pName(e.projectId)+' · to‘lov'; s+=' · '+mShort(e.forMonth)+' uchun'+(e.currency==='USD'?' · $'+fmt(e.usd)+' × '+fmt(e.rate):''); }
  else if(e.type==='reimburse'){ t='Kassadan o‘zimga qaytardim'; }
  var d=cashDelta(e), amt=e.type==='expense'&&e.payer==='ozim'?'−'+fmt(e.amount):(d>0?'+'+fmt(d):fmt(d));
  var color=d>0?'pos':(e.type==='expense'&&e.payer==='ozim'?'mut':'');
  return {t:t,s:s,cls:cls,amt:amt,color:color};
}
function entryRow(e){
  var i=entryInfo(e);
  return '<button type="button" class="rowbtn" data-a="entry" data-id="'+esc(e.id)+'"><span class="col"><span class="t">'+esc(i.t)+'</span><span class="k '+i.cls+'" style="font-weight:'+(i.cls?'600':'400')+'">'+esc(i.s)+'</span></span><span class="t '+i.color+'" style="flex:none;font-weight:700">'+i.amt+'</span></button>';
}

    '<button type="button" class="card col tap" data-a="nav" data-v="kirim" style="gap:4px"><span class="k">Kassada hozir</span><span class="v">'+fmt(kassa)+'</span><span class="k">Kirim-chiqimni ochish</span></button>'+

  function oylik(){

  if(t.closest('#sheetRoot')){ if(SH&&SH.on) SH.on(a,t,ev); else if(a==='sheet-close') closeSheet(); return; }
  act(a,t);
});
document.addEventListener('input',function(ev){ var t=ev.target; if(t&&t.dataset&&t.dataset.in&&SH&&SH.inp&&t.closest('#sheetRoot')&&t.tagName!=='SELECT'&&t.type!=='checkbox') SH.inp(t.dataset.in,t); });
document.addEventListener('change',function(ev){
  var t=ev.target; if(!t) return;
  if(t.id==='contractFile'){ uploadContract(t); return; }
  if(t.dataset&&t.dataset.in&&SH&&SH.inp&&t.closest('#sheetRoot')) SH.inp(t.dataset.in,t);
});
document.addEventListener('submit',function(ev){ if(ev.target&&ev.target.id==='loginForm'){ ev.preventDefault(); doLogin(); } });
document.addEventListener('focusout',function(ev){ var t=ev.target; if(t&&t.dataset&&t.dataset.money&&String(t.value).trim()!=='') t.value=fmt(num(t.value)); });
document.addEventListener('keydown',function(ev){ if(ev.key==='Escape'&&SH) closeSheet(); });

window.__HA={S:S,saveCache:saveCache,calc:calc,cashUntil:cashUntil,ownerDebt:ownerDebt,staffOutstanding:staffOutstanding,clientDebtList:clientDebtList,checks:checks,put:put,render:render,importData:importData};
init();
if('serviceWorker' in navigator&&location.protocol==='https:') window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
})();
